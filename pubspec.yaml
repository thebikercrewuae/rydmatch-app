name: rydmatch
description: RydMatch — Just Ride
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.9.1
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1
  material_symbols_icons: ^4.2906.0

  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.0.4
  permission_handler: ^11.1.0
  flutter_card_swiper: ^7.2.0
  flutter_slidable: ^4.0.3
  intl: ^0.19.0
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.14.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  universal_html: ^2.2.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - env.json
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ChatGPT_Image_May_12__2026__04_32_00_PM-1778589205134.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/ChatGPT_Image_May_12__2026__04_32_00_PM-1778589205134.png"
  web:
    generate: true
    image_path: "assets/images/ChatGPT_Image_May_12__2026__04_32_00_PM-1778589205134.png"
    background_color: "#000000"
    theme_color: "#000000"
