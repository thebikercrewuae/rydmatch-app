workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.0
      groups:
        - rydmatch-prod

    scripts:
      - name: Generate release keystore
        script: |
          if [ ! -f "$CM_BUILD_DIR/rydmatch-release-key.jks" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$CM_BUILD_DIR/rydmatch-release-key.jks" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              -alias "$CM_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RydMatch, OU=RydMatch, O=RydMatch, L=Dubai, ST=Dubai, C=AE"
          fi

      - name: Create key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/rydmatch-release-key.jks
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Build Android App Bundle
        script: |
          patch_gradle_file() {
            perl -0pi -e 's/minSdkVersion\s+flutter\.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            sed -n '20,35p' android/app/build.gradle.kts
          }

          encode_define() {
            printf "%s" "$1" | base64 | tr -d '\n'
          }

          DART_DEFINES="$(encode_define "SUPABASE_URL=$SUPABASE_URL"),$(encode_define "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"),$(encode_define "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY")"

          patch_gradle_file

          cd android

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD bundleRelease \
            -Pdart-defines="$DART_DEFINES" \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Ptarget=lib/main.dart \
            -Ptrack-widget-creation=false \
            -Ptree-shake-icons=true

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/bundle/release/app-release.aab
      - rydmatch-release-key.jks
