workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.0
      groups:
        - rydmatch-prod

    scripts:
      - name: Generate release keystore
        script: |
          if [ ! -f "$CM_BUILD_DIR/rydmatch-release-key.jks" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$CM_BUILD_DIR/rydmatch-release-key.jks" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              -alias "$CM_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RydMatch, OU=RydMatch, O=RydMatch, L=Dubai, ST=Dubai, C=AE"
          fi

      - name: Create key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/rydmatch-release-key.jks
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Patch Android Gradle file
        script: |
          perl -0pi -e 's/minSdkVersion\s+flutter\.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          perl -0pi -e 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          sed -n '20,35p' android/app/build.gradle.kts

      - name: Print Android Gradle file
        script: |
          sed -n '20,35p' android/app/build.gradle.kts

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - rydmatch-release-key.jks
