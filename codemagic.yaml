workflows:
  android-release-apk:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.0
      groups:
        - rydmatch-prod

    scripts:
      - name: Restore release keystore
        script: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/rydmatch-release-key.jks"

      - name: Create key.properties
        script: |
          printf "storePassword=%s\n" "$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          printf "keyPassword=%s\n" "$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          printf "keyAlias=%s\n" "$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          printf "storeFile=%s\n" "$CM_BUILD_DIR/rydmatch-release-key.jks" >> "$CM_BUILD_DIR/android/key.properties"

      - name: Install Android SDK components
        script: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; using preinstalled Android SDK components."
            exit 0
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Build Android APK
        script: |
          patch_gradle_file() {
            perl -0pi -e 's/minSdkVersion\s+flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk\s*=\s*21/minSdk = 24/g' android/app/build.gradle.kts
            sed -n '20,45p' android/app/build.gradle.kts
          }

          encode_define() {
            printf "%s" "$1" | base64 | tr -d '\n'
          }

          DART_DEFINES="$(encode_define "SUPABASE_URL=$SUPABASE_URL"),$(encode_define "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"),$(encode_define "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"),$(encode_define "STRAVA_CLIENT_ID=$STRAVA_CLIENT_ID"),$(encode_define "STRAVA_REDIRECT_URI=$STRAVA_REDIRECT_URI")"

          patch_gradle_file

          cd android

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          set +e
          $GRADLE_CMD assembleRelease \
            -Pdart-defines="$DART_DEFINES" \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Ptarget=lib/main.dart \
            -Ptrack-widget-creation=false \
            -Ptree-shake-icons=true \
            --stacktrace 2>&1 | tee ../gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          cd "$CM_BUILD_DIR"

          echo "APK files found:"
          find . -type f -name "*.apk" -print

          echo "Last 200 lines of Gradle log:"
          tail -n 200 gradle-build.log

          exit $BUILD_STATUS

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/release/*.json
      - rydmatch-release-key.jks
      - gradle-build.log
