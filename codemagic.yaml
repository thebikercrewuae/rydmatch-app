workflows:
  android-release-apk:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.0
      groups:
        - rydmatch-prod

    scripts:
      - name: Generate release keystore
        script: |
          if [ ! -f "$CM_BUILD_DIR/rydmatch-release-key.jks" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$CM_BUILD_DIR/rydmatch-release-key.jks" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              -alias "$CM_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RydMatch, OU=RydMatch, O=RydMatch, L=Dubai, ST=Dubai, C=AE"
          fi

      - name: Create key.properties
        script: |
          printf "storePassword=%s\n" "$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          printf "keyPassword=%s\n" "$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          printf "keyAlias=%s\n" "$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          printf "storeFile=%s\n" "$CM_BUILD_DIR/rydmatch-release-key.jks" >> "$CM_BUILD_DIR/android/key.properties"

      - name: Install clean Android NDK
        script: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi

          echo "Using sdkmanager at: $SDK_MANAGER"

          rm -rf "$ANDROID_HOME/ndk/27.0.12077973"

          for attempt in 1 2 3; do
            echo "Installing Android NDK attempt $attempt..."
            yes | "$SDK_MANAGER" --install "ndk;27.0.12077973" && break
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            sleep 20
          done

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Build Android APK
        script: |
          patch_gradle_file() {
            perl -0pi -e 's/minSdkVersion\s+flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk\s*=\s*21/minSdk = 24/g' android/app/build.gradle.kts
            sed -n '20,35p' android/app/build.gradle.kts
          }

          patch_gradle_file

          set +e
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            2>&1 | tee gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          echo "APK files found:"
          find "$CM_BUILD_DIR" -name "*.apk" -type f -print

          echo "Last 200 lines of build log:"
          tail -n 200 gradle-build.log

          exit $BUILD_STATUS

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - android/app/build/outputs/apk/**/*.apk
      - rydmatch-release-key.jks
      - gradle-build.log
